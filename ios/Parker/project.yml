# The iPhone companion's Xcode project, generated by XcodeGen:
#
#   brew install xcodegen && cd ios/Parker && xcodegen generate
#
# The .xcodeproj is not committed — this file is the source of truth. The
# UI-free core lives in ../ParkerCore; the design tokens the app paints from
# are bundled straight from shared/, so the phone reads what the Mac wrote.
name: Parker
options:
  bundleIdPrefix: dev.getparker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ParkerCore:
    path: ../ParkerCore
targets:
  Parker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../shared/design-tokens.json
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: ParkerCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Parker
        CFBundleName: Parker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The app's own Documents folder shows up in Files ("On My iPhone ›
        # Parker") — the honest home for "Start fresh" until the iCloud
        # container is set up with the signing account.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        # Geist Mono, the Mac editor's face (SIL OFL 1.1; license beside the files).
        UIAppFonts: [GeistMono-Variable.ttf, GeistMono-Italic-Variable.ttf]
        # The app's iCloud Drive folder, visible in Files and on every Mac with
        # the same account as iCloud Drive › Parker. One container per build
        # flavour (the entitlement uses the bundle id); both are listed here
        # because plist keys cannot be substituted.
        NSUbiquitousContainers:
          iCloud.dev.getparker.parker:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Parker
            NSUbiquitousContainerSupportedFolderLevels: Any
          iCloud.dev.getparker.parker.dev:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Parker Dev
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Sources/Parker.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: ["iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)"]
        com.apple.developer.ubiquity-container-identifiers: ["iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.getparker.parker
        DEVELOPMENT_TEAM: H5X7SH54MC
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          # A second app on the device, with its own folder: the real notes
          # stay out of reach of a development build.
          PRODUCT_BUNDLE_IDENTIFIER: dev.getparker.parker.dev
          INFOPLIST_KEY_CFBundleDisplayName: Parker Dev
schemes:
  Parker:
    build:
      targets:
        Parker: all
    run:
      config: Debug
