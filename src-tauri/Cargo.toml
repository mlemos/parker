[package]
name = "parker"
version = "0.4.2"
description = "Parker — a fast, minimal editor for notes, code and markdown"
authors = ["mlemos"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Real files in a throwaway directory for the atomic-write tests.
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
# Watch the notes folder so external edits (git pull, another machine, another
# editor) reload in the app instead of being silently clobbered by autosave.
notify = "6"
# Move deleted notes to the OS Trash instead of unlinking (recoverable).
trash = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Raw Obj-C messaging to tweak the NSWindow collection behavior (already in the
# tree via Tauri) so summon follows the user to the active Space.
objc2 = "0.6"

