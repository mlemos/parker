name: guard

# Public repo, public app: every push gets checked for things that shouldn't
# be published, and for the logic that's easy to break by accident.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag: a tag can be moved to other
# code, a SHA can't. Dependabot (.github/dependabot.yml) proposes the updates.

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan the whole tree, not just the tip commit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Secrets, personal paths, notes, build artifacts — see the script.
      - name: Repo hygiene
        run: node scripts/check-repo-hygiene.mjs

      # package.json, tauri.conf.json, Cargo.toml, Cargo.lock and the landing
      # page all state a version. They only drift on the way to a release.
      - name: Versions agree
        run: node scripts/check-versions.mjs

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # The layout tree, the to-do state machine, the markdown renderer and the
      # rest of src/lib. See src/lib/*.test.ts.
      - name: Frontend tests
        run: pnpm test

  # The backend owns the user's files, so it gets its own job — on macOS,
  # because that's the platform Parker ships on and the one these paths run on.
  backend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile

      # tauri-build wants the frontend bundle to exist before it will build the
      # crate, and building it here checks the real build too.
      - name: Build the frontend
        run: pnpm build

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Note names, atomic writes, settings/session files, git output parsing.
      # See the tests module at the end of src-tauri/src/lib.rs.
      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The iPhone companion's UI-free core: the to-do grammar (checked against
      # the same fixtures as the TypeScript suite) and the design-token contract.
      - name: iOS core tests
        run: swift test --package-path ios/ParkerCore

  # Known vulnerabilities in what ships: the npm packages in the app bundle
  # and the Rust crates. Not blocking for now — the first weeks measure how
  # much noise it makes before it gets to fail a build.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - name: npm packages (production only)
        run: pnpm audit --prod
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Rust crates
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
